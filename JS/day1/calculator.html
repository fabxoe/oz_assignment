<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사칙연산 계산기</title>
    <script src="calculator.js" defer></script>
</head>
<body>
    <h1>콘솔창 계산기 프로그램</h1>
    <p>1. Option + Command + i 키를 눌러 콘솔 창을 여세요.</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>
    <p>3. 공백 없이 입력하거나 괄호를 포함한 긴 계산식도 사용할 수 있습니다.</p>
    <p>예시: start("10+2*(8-3)/5")</p>
</body>
</html>
